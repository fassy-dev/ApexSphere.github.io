<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - ApexSphere</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" href="/img/favicon.ico">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preload" as="image" href="img/background.jpg">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .not-found {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 96px 20px 40px;
            text-align: center;
        }

        .not-found__box {
            width: min(100%, 680px);
            padding: 42px 28px;
            background: rgba(10, 24, 53, 0.9);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            box-shadow: 0 20px 70px rgba(0, 255, 224, 0.18);
        }

        .not-found__code {
            display: block;
            margin-bottom: 16px;
            color: var(--gold);
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 800;
            line-height: 1;
        }

        .not-found h1 {
            margin: 0 0 14px;
            color: var(--cyan);
        }

        .not-found p {
            margin: 0 auto 26px;
            max-width: 520px;
            color: #dbe7ff;
            line-height: 1.6;
        }

        .not-found .btn-base {
            padding: 14px 22px;
            background: var(--minecraft-green);
            color: #00130d;
        }
    </style>
</head>
<body>
<canvas id="particles-canvas" aria-hidden="true"></canvas>

<main class="not-found">
    <section class="not-found__box">
        <span class="not-found__code">404</span>
        <h1>Такой страницы нет</h1>
        <p>Ссылка могла устареть или быть набрана с ошибкой. Вернитесь на главную страницу ApexSphere и продолжайте путь оттуда.</p>
        <a href="index.html" class="btn-base">На главную</a>
    </section>
</main>

<script src="/js/config.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
